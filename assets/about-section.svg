<svg xmlns="http://www.w3.org/2000/svg" width="760" height="180" viewBox="0 0 760 180" role="img" aria-label="Keerthana. B.E. CSE (AI &amp; ML), Machine Learning, NLP">
  <title>Keerthana. B.E. CSE (AI &amp; ML), Machine Learning, NLP</title>
  <defs>
    <linearGradient id="gCard" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE9CC"/><stop offset=".55" stop-color="#FFDBB0"/><stop offset="1" stop-color="#FFD2A2"/></linearGradient>
    <linearGradient id="gYellow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFEC"/><stop offset=".55" stop-color="#FFFAD3"/><stop offset="1" stop-color="#FFF0B3"/></linearGradient>
    <linearGradient id="gAccent" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFC9C9"/><stop offset=".55" stop-color="#FFB1B1"/><stop offset="1" stop-color="#FFA0A0"/></linearGradient>
    <linearGradient id="gChip" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFDDD0"/><stop offset="1" stop-color="#FFCCB8"/></linearGradient>
    <linearGradient id="gEdge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity=".15"/></linearGradient>
    <linearGradient id="gGloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".5"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="gShine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".6"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="gLine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFCCB8" stop-opacity="0"/><stop offset=".2" stop-color="#FFCCB8"/><stop offset=".8" stop-color="#FFCCB8"/><stop offset="1" stop-color="#FFCCB8" stop-opacity="0"/></linearGradient>
  </defs>
  <style>
.fl{animation:fl 6s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.sh{animation:sh 8s ease-in-out infinite}
@keyframes sh{0%{transform:translateX(0)}45%,100%{transform:translateX(1080px)}}
.dr{animation:dr 9s ease-in-out infinite}
@keyframes dr{0%,100%{transform:translate(0,0)}50%{transform:translate(-10px,8px)}}
.up{animation:up .7s ease-out both}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.gr{transform-box:fill-box;transform-origin:0 50%;animation:gr 1.3s cubic-bezier(.2,.8,.2,1) both}
@keyframes gr{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.nu{animation:nu 2.4s ease-in-out infinite}
@keyframes nu{0%,100%{transform:translate(0,0)}50%{transform:translate(3px,-3px)}}
.nr{animation:nr 2.4s ease-in-out infinite}
@keyframes nr{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
.pu{transform-box:fill-box;transform-origin:center;animation:pu 2.6s ease-out infinite}
@keyframes pu{0%{transform:scale(1);opacity:.9}100%{transform:scale(1.9);opacity:0}}
.bn{animation:bn 1.6s ease-in-out infinite}
@keyframes bn{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.ul{transform-box:fill-box;transform-origin:center;animation:ul 3.2s ease-in-out infinite}
@keyframes ul{0%,100%{transform:scaleX(.55)}50%{transform:scaleX(1)}}
.tv{animation:tv 7s ease-in-out infinite alternate}
@keyframes tv{from{transform:translateX(0)}to{transform:translateX(0px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
  <g transform="translate(0,4)">
    <clipPath id="face"><rect width="760" height="168" rx="16"/></clipPath>
    <rect y="8" width="760" height="168" rx="16" fill="#EDBE93"/>
    <g class="fl" style="animation-delay:-0s">
      <rect x=".75" y=".75" width="758.5" height="166.5" rx="16" fill="url(#gCard)" stroke="url(#gEdge)" stroke-width="1.5"/>
      <g clip-path="url(#face)"><g class="dr"><circle cx="720" cy="20" r="112" fill="#FFB1B1" fill-opacity=".30"/><circle cx="630" cy="164" r="56" fill="#FFCCB8" fill-opacity=".65"/><circle cx="540" cy="30" r="9" fill="#FFB1B1" fill-opacity=".6"/><circle cx="732" cy="128" r="7" fill="#fff" fill-opacity=".6"/></g><rect width="760" height="84" fill="url(#gGloss)"/><g class="sh" style="animation-delay:-0s"><rect x="-170" y="-20" width="80" height="208" fill="url(#gShine)" transform="skewX(-20)"/></g></g>
      <circle cx="96" cy="84" r="58" fill="#fff" fill-opacity=".45"/><circle cx="96" cy="84" r="50" fill="url(#gAccent)" stroke="#fff" stroke-opacity=".8" stroke-width="3"/><text x="96" y="103" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="56" font-weight="700" fill="#4A2C1D">K</text>
<text x="180" y="78" text-anchor="start" font-family="'Segoe UI', Arial, sans-serif" font-size="54" font-weight="700" fill="#4A2C1D">Keerthana</text>
<text x="182" y="116" text-anchor="start" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="400" fill="#7A5240">B.E. CSE (AI &amp; ML) · Machine Learning · NLP</text>
<rect x="182" y="132" width="72" height="6" rx="3" fill="url(#gAccent)"/>
    </g>
  </g>
</svg>
