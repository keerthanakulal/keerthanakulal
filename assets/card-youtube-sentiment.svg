</g>
<g><rect x="170" y="148" width="60" height="26" rx="13.0" fill="#F2B4A0"/><rect x="170" y="146" width="60" height="26" rx="13.0" fill="url(#gChip)"/><text x="200.0" y="163.5" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="500" fill="#4A2C1D">VADER</text>
</g>
