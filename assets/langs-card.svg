<text x="344" y="210" text-anchor="end" font-family="'Segoe UI', Arial, sans-serif" font-size="14.5" font-weight="700" fill="#FCF1D0">0.1%</text>
<rect x="24" y="217" width="320" height="9" rx="4.5" fill="#22396F"/><rect class="gr" style="animation-delay:0.48s" x="24" y="217" width="9.0" height="9" rx="4.5" fill="url(#gAccent)"/><text x="24" y="239" text-anchor="start" font-family="'Segoe UI', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#FCF1D0">C++</text>
