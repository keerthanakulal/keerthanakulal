<svg xmlns="http://www.w3.org/2000/svg" width="380" height="288" viewBox="0 0 380 288" role="img" aria-label="Top languages by code size across public repositories: Jupyter Notebook 93.4%, Python 4.3%, HTML 1.7%, C 0.5%, PowerShell 0.1%, C++ 0.0%">
  <title>Top languages by code size across public repositories: Jupyter Notebook 93.4%, Python 4.3%, HTML 1.7%, C 0.5%, PowerShell 0.1%, C++ 0.0%</title>
  <defs>
    <linearGradient id="gCard" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1A2E5E"/><stop offset=".5" stop-color="#0D1C42"/><stop offset="1" stop-color="#091340"/></linearGradient>
    <linearGradient id="gAccent" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF8E6"/><stop offset=".55" stop-color="#FCF1D0"/><stop offset="1" stop-color="#EBDAAA"/></linearGradient>
    <linearGradient id="gChip" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2E4A88"/><stop offset="1" stop-color="#22396F"/></linearGradient>
    <linearGradient id="gEdge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FCF1D0" stop-opacity=".55"/><stop offset="1" stop-color="#FCF1D0" stop-opacity=".06"/></linearGradient>
    <linearGradient id="gGloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FCF1D0" stop-opacity=".12"/><stop offset="1" stop-color="#FCF1D0" stop-opacity="0"/></linearGradient>
    <linearGradient id="gShine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FCF1D0" stop-opacity="0"/><stop offset=".5" stop-color="#FCF1D0" stop-opacity=".22"/><stop offset="1" stop-color="#FCF1D0" stop-opacity="0"/></linearGradient>
    <linearGradient id="gLine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22396F" stop-opacity="0"/><stop offset=".2" stop-color="#22396F"/><stop offset=".8" stop-color="#22396F"/><stop offset="1" stop-color="#22396F" stop-opacity="0"/></linearGradient>
  </defs>
  <style>
.fl{animation:fl 6s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.sh{animation:sh 8s ease-in-out infinite}
@keyframes sh{0%{transform:translateX(0)}45%,100%{transform:translateX(700px)}}
.dr{animation:dr 9s ease-in-out infinite}
@keyframes dr{0%,100%{transform:translate(0,0)}50%{transform:translate(-10px,8px)}}
.up{animation:up .7s ease-out both}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.gr{transform-box:fill-box;transform-origin:0 50%;animation:gr 1.3s cubic-bezier(.2,.8,.2,1) both}
@keyframes gr{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.nu{animation:nu 2.4s ease-in-out infinite}
@keyframes nu{0%,100%{transform:translate(0,0)}50%{transform:translate(3px,-3px)}}
.nr{animation:nr 2.4s ease-in-out infinite}
@keyframes nr{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
.pu{transform-box:fill-box;transform-origin:center;animation:pu 2.6s ease-out infinite}
@keyframes pu{0%{transform:scale(1);opacity:.9}100%{transform:scale(1.9);opacity:0}}
.bn{animation:bn 1.6s ease-in-out infinite}
@keyframes bn{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.ul{transform-box:fill-box;transform-origin:center;animation:ul 3.2s ease-in-out infinite}
@keyframes ul{0%,100%{transform:scaleX(.55)}50%{transform:scaleX(1)}}
.tv{animation:tv 7s ease-in-out infinite alternate}
@keyframes tv{from{transform:translateX(0)}to{transform:translateX(0px)}}
.tw{transform-box:fill-box;transform-origin:center;animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{transform:scale(.35) rotate(0);opacity:.35}50%{transform:scale(1) rotate(45deg);opacity:1}}
.rot{transform-box:fill-box;transform-origin:center;animation:rot 18s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.upw{animation:up .7s ease-out both,wv 4.5s ease-in-out infinite}
@keyframes wv{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
  <g transform="translate(12,4)">
