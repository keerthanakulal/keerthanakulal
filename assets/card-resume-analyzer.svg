<svg xmlns="http://www.w3.org/2000/svg" width="380" height="216" viewBox="0 0 380 216" role="img" aria-label="AI Resume Analyzer and Job Matcher: matches resumes to job descriptions with a match score. Python, Flask, NLP, Sentence-BERT">
