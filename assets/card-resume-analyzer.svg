    <linearGradient id="gChip" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2E4A88"/><stop offset="1" stop-color="#22396F"/></linearGradient>
    <linearGradient id="gEdge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FCF1D0" stop-opacity=".55"/><stop offset="1" stop-color="#FCF1D0" stop-opacity=".06"/></linearGradient>
    <linearGradient id="gGloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FCF1D0" stop-opacity=".12"/><stop offset="1" stop-color="#FCF1D0" stop-opacity="0"/></linearGradient>
    <linearGradient id="gShine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FCF1D0" stop-opacity="0"/><stop offset=".5" stop-color="#FCF1D0" stop-opacity=".22"/><stop offset="1" stop-color="#FCF1D0" stop-opacity="0"/></linearGradient>
